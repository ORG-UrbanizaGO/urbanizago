name: urbanizago
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urbanizago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copie o arquivo .env.example para .env}
      POSTGRES_DB: ${POSTGRES_DB:-urbanizago}
    ports: ['127.0.0.1:5433:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
  minio:
    image: pgsty/silo:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Configure MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Configure MINIO_ROOT_PASSWORD}
    ports: ['127.0.0.1:${MINIO_PORT:-9000}:9000', '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001']
    volumes: [minio_data:/data]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 12
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ['127.0.0.1:${SMTP_PORT:-1025}:1025', '127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025']
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-urbanizago}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-urbanizago}
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    ports: ['${API_PORT:-3000}:3000']
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      mailhog: { condition: service_started }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  web-admin:
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    ports: ['${WEB_PORT:-5173}:8080']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  minio_data:
